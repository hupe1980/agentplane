# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
#
# A person approves every answer before it is returned — from a terminal:
#
#   agentplane run examples/approval.yaml --input '{"ticket": "T-1"}' --store runs.redb
#   agentplane tasks --store runs.redb
#   agentplane decide <task> approve --reason "checked" --actor ada --store runs.redb
#   agentplane replay <run> --manifest examples/approval.yaml --store runs.redb
#
# `model:` is shorthand for `models: { privileged: … }`, and a declarative agent
# that names no capability provides its own `metadata.name` — both resolve
# before the digest is taken, so the longhand file is the same agent.
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata: { name: approved-summary, version: "1.0.0" }
spec:
  execution: { kind: completion }
  identity:
    role: "Summarise a support ticket"
    constraints: "One sentence. No speculation."
  model: { provider: fake, model: sum-1 }
  output:
    schema:
      type: object
      additionalProperties: false
      required: [summary]
      properties: { summary: { type: string } }
  oversight:
    approval: required
    deadline: { name: review, kind: hours, params: { n: 8 } }
  budgets: { max_tokens: 10000 }
