\* Model for Delegation.
\*
\* Two grants give four distinct scopes — enough for a chain to narrow twice,
\* and for the `DelegateCanWiden` mutant to have a genuine widening available
\* at every hop. A third grant multiplies the state space without adding a
\* failure shape: attenuation is a property of subset containment, not of how
\* many grants exist.
\*
\* Every ending is reachable: "loaded" through an untampered (or harmlessly
\* tampered) store, "rejected" through a tamper that breaks well-formedness —
\* tampering is a choice in the state graph, not a fate.

CONSTANTS
    Grants   = {"read", "write"}
    MaxDepth = 3

SPECIFICATION Spec

INVARIANT Safety

PROPERTIES
    EveryChainIsJudged
