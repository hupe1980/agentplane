\* Model for Equivocation.
\*
\* Two witnesses is the minimum that can disagree, and the shape needs no
\* third: the attack is "one observer saw the history the fork diverged from,
\* another did not".
\*
\* ForkAt = 1 puts the divergence one record in, so a checkpoint at size 1 is
\* on both histories and one at size 2 is on exactly one. That is the whole
\* geometry; a later fork point only lengthens the shared prefix.
\*
\* Seven steps reaches the attack and its detection: grow, grow, submit to the
\* honest witness, fork, grow, submit to the fresh witness, gather, audit is
\* eight — so the bound is set where the reader still gets to run, and the
\* shorter interleavings (refusal, partial gather, honest run) all fit inside
\* it.

CONSTANTS
    Witnesses = {1, 2}
    ForkAt    = 1
    MaxSteps  = 8

SPECIFICATION Spec

INVARIANT Safety

PROPERTIES
    CosignaturesAreKept
    RunsItsCourse
