\* Model for Delivery.
\*
\* Two runs wait on one key. A names a sender and may conclude while waiting;
\* B takes any sender and never concludes, so a message a closed run released
\* has a live waiter behind it. Two producers send one id each — the
\* collision the key must survive — either to whoever waits or to one run by
\* name. Two waits per run make a second turn on the same key, the one a
\* consumed message must never reach again. One crash falls between storing a
\* message and matching it.
\*
\* Assumed: the plane's own steps (register, in-step claim, match, resume,
\* retire) are weakly fair, and a counterparty retries a delivery that got no
\* answer. Not assumed: that anybody sends, concludes, fires or crashes.

CONSTANTS
    Runs = {"A", "B"}
    Ending = {"A"}
    Picky = "A"
    Turns = 2
    MaxCrashes = 1

SPECIFICATION Spec

INVARIANT Safety

PROPERTIES
    EveryMessageReachesAWaiter
