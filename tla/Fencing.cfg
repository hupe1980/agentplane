\* Model for Fencing.
\*
\* Two instances is sufficient: split-brain is a property of "more than one
\* writer", and a third adds states without adding a failure shape.
\*
\* Six steps reaches every shape the model has: acquire -> write -> lapse ->
\* takeover -> zombie write refused (5), and acquire -> renew -> write ->
\* lapse -> takeover -> write (6). Every ending is a choice, not fate: the
\* same bound covers the clean run, the fenced zombie, and the lease that
\* lapses and is re-claimed by its old owner.

CONSTANTS
    Instances = {1, 2}
    MaxSteps  = 6

SPECIFICATION Spec

INVARIANT Safety

PROPERTIES
    JournalIsAppendOnly
    RunsItsCourse
