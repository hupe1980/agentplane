\* Model for EffectProtocol.
\*
\* Three effects and two crashes reaches every interesting interleaving:
\* crash-before-announce, crash-between-announce-and-act, crash-after-act-
\* before-record, and crash-during-replay. Raising either bound multiplies
\* states without covering a new shape.

CONSTANTS
    EffectCount = 3
    MaxCrashes  = 2

SPECIFICATION Spec

INVARIANT Safety

PROPERTIES
    JournalIsAppendOnly
    WorldIsAppendOnly
    Terminates
