\* Model for TaskDelivery.
\*
\* Two deciders make a second decider's answer, and a resubmission by the
\* first, reachable; the expiry policy makes a third answerer racing both. The
\* run may conclude at any point between a claim and its answer.
\*
\* Assumed: WF(Answer), WF(Withdraw). Not assumed: that anybody claims, that
\* the task expires, or that the run concludes.

CONSTANTS
    Deciders = {"alice", "bob"}
    Expiry = "expiry"

SPECIFICATION Spec

INVARIANT Safety

PROPERTIES
    NoTaskOutlivesItsRun
