\* Model for KeyLifecycle.
\*
\* Two versions make a rotation and a retirement of the older one reachable;
\* two reasons make a second destruction that could rewrite the first. An
\* outage can fall before or after a destruction, and a seal can race one.
\*
\* Assumed: WF(Restore), and SF on opening while the key ring answers. Not
\* assumed: that anything is sealed, rotated, retired or destroyed.

CONSTANTS
    MaxVersion = 2
    Reasons = {"request", "retention"}

SPECIFICATION Spec

INVARIANT Safety

PROPERTIES
    OutageEventuallyAnswered
