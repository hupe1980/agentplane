\* Model for EffectGroup.
\*
\* The shape of the constants decides what the model can actually reach, and
\* getting it wrong makes invariants pass for want of a second element rather
\* than because the protocol is right — the failure `Saga.cfg` records.
\*
\*   3 reversible members  -> `ReversalIsBackwards` and `ReversedAtMostOnce`
\*                            need at least two reversals in one run to mean
\*                            anything. Three leaves room for the unwind to
\*                            stop partway at the bad one and still have
\*                            reversed more than one before it.
\*   2 deferred members    -> two is the minimum that distinguishes
\*                            `DeferredFailsFirst` from `DeferredFailsLate`,
\*                            and therefore the minimum at which
\*                            `NoUnwindPastAnExternalisedDeferred` is
\*                            reachable at all. With one gated member the
\*                            "fails after another landed" case cannot occur.
\*   BadReversals = {1}    -> the FIRST member to land, so it is the LAST the
\*                            unwind reaches: members 3 and 2 come back before
\*                            the failure stops it. Putting it at 3 would stop
\*                            the unwind immediately and leave the ordering
\*                            invariants vacuous. Failure is a choice here too:
\*                            a fated {1} made a COMPLETED unwind impossible,
\*                            so `settled = "aborted"` was unreachable and
\*                            `AbortIsComplete` held for want of an abort.
\*   BadDeferreds = {1, 2} -> failure is a CHOICE, not a fate: a bad member may
\*                            also send, so listing both keeps every ending
\*                            reachable in one model. Member 1 failing first is
\*                            what makes `DeferredFailsFirst` fire at all — the
\*                            old {2} left that transition dead, which is how
\*                            the abort-after-commit hole passed its model.
\*                            Member 2 failing after member 1 went out is what
\*                            `NoUnwindPastAnExternalisedDeferred` exists for.
\*
\* There is no HasAtomic constant: whether the group has atomic members is an
\* initial-state choice (`txState \in {"none", "pending"}`), so one run explores
\* groups with and without them. A constant would leave whichever value this
\* file omitted entirely unchecked.

CONSTANTS
    Reversibles  = 3
    Deferreds    = 2
    BadReversals = {1}
    BadDeferreds = {1, 2}

SPECIFICATION Spec

INVARIANT Safety

PROPERTIES
    ReversalIsAppendOnly
    AlwaysSettles
