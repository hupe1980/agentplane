\* Model for RateWindow.
\*
\* Two runs making the same call, a ceiling of 1 in a window of 2 ticks, over
\* four instants: enough for a row at the end of one fixed bucket and another
\* at the start of the next, for a retry after the window has room again, and
\* for the second run to be refused and later admitted.
\*
\* Assumed: WF(Reserve). Not assumed: that time advances.

CONSTANTS
    Runs = {1, 2}
    MaxAttempts = 2
    Ceiling = 1
    Window = 2
    MaxTime = 3

SPECIFICATION Spec

INVARIANT Safety

PROPERTIES
    EveryDispatchAnswered
