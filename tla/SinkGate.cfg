\* Model for SinkGate.
\*
\* Two steps, both sending a value above the low ceiling: a refused send and a
\* covered one, a release before a send, and a configuration edited in either
\* direction between passes are all reachable. Two crashes make a resume that
\* replays a refusal and then runs a live tail — and the second step being high
\* is what puts a value that needs the gate into that tail. With only the first
\* step high, the tail would carry nothing to judge and a gate skipped on
\* resume would pass unnoticed.
\*
\* Assumed: WF(Send). Not assumed: that anybody releases, edits or crashes.

CONSTANTS
    N = 2
    High = {1, 2}
    MaxCrashes = 2

SPECIFICATION Spec

INVARIANT Safety

PROPERTIES
    EverySendIsDecided
