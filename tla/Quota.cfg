\* Model for Quota.
\*
\* Two runs of tenant 1 against a concurrency ceiling of 1 and a spend
\* ceiling of 1 with a worst case of 1 each: a suspended run holds the whole
\* period, so a second admission is the one a settled-only check lets through.
\* One run of tenant 2 makes a cross-tenant refusal reachable. Two periods make
\* a pass that spans the boundary, and a resume in the later one, reachable;
\* one crash reaches both a dead pass (recovery) and a sealed run whose slot was
\* never given back (the sweep). Two passes cover an admission followed by a resume or a recovery.
\*
\* Assumed: WF(Resume), WF(FinishRelease), WF(SweepRelease). Not assumed:
\* that any run is ever admitted, spends, suspends or concludes.

CONSTANTS
    Runs = {1, 2, 3}
    Second = {3}
    MaxConc = 1
    Ceiling = 1
    Worst = 1
    MaxPeriod = 2
    MaxPasses = 2
    MaxCrashes = 1

SPECIFICATION Spec

INVARIANT Safety

PROPERTIES
    SuspendedRunsResume
    SealedSlotEventuallyReleased
