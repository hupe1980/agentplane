name: Release

# Tag-triggered. The tag points at a commit CI has already gated, so this does
# not re-run the assurance ladder — it checks the two things a tag can get
# wrong, then publishes.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v2

      # A tag that disagrees with Cargo.toml publishes a version nobody asked
      # for, and crates.io is immutable.
      - name: Tag matches Cargo.toml
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag=${GITHUB_REF_NAME#v}
          echo "tag=$tag crate=$crate"
          [ "$tag" = "$crate" ] || { echo "::error::tag v$tag != Cargo.toml $crate"; exit 1; }

      # Refuses if the internal design document is in the tarball. Cheap here,
      # impossible to undo once published.
      - run: just package

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
