\* Model for Saga.
\*
\* The unwind stops at the FIRST stopper it meets going backwards, so where the
\* stoppers sit decides what the model can reach:
\*
\*   1  pivot         -> reached when the run failed early
\*   2  unnecessary   -> skipped; the unwind continues past it
\*   3  undeclared    -> reached when the run failed late
\*   4  compensatable
\*   5  compensatable
\*   6  compensatable
\*
\* The three compensatable steps sitting ABOVE both stoppers is the load-bearing
\* part. An earlier version put them below, so no run ever compensated more than
\* one step — which made `UnwindIsReverse` and `CompensatedAtMostOnce` true for
\* want of a second element rather than because the protocol is right. Two
\* invariants passing vacuously in a 25-state model is exactly the failure the
\* mutation pass exists to catch.

CONSTANTS
    StepCount     = 6
    MaxSuspends   = 2
    Pivots        = {1}
    Unnecessaries = {2}
    Undeclareds   = {3}

SPECIFICATION Spec

INVARIANT Safety

PROPERTIES
    UndoIsAppendOnly
    Terminates
