\* Model for RetrySafety.
\*
\* Three effects cover all three shapes in one run:
\*
\*   1  mutates AND can be asked about  -> the probe path
\*   2  mutates, nothing to ask         -> the escalation path
\*   3  a read                          -> repeat freely
\*
\* A model with fewer shapes would leave part of the rule unexercised, and the
\* interesting rule is the one that distinguishes them.
\*
\* Three attempts reaches retry-after-retry, which is where an off-by-one in the
\* attempt bound would show up. A fourth adds states without a new shape.

CONSTANTS
    EffectCount  = 3
    MaxAttempts  = 3
    Mutating     = {1, 2}
    Reconcilable = {1}

SPECIFICATION Spec

INVARIANT Safety

PROPERTIES
    JournalIsAppendOnly
    Terminates
