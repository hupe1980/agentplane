\* Model for Authorization.
\*
\* Four effects; position 3 is the one the original ruleset MAY refuse. Whether
\* it does is an initial-state choice inside the spec (`banned \in SUBSET
\* Forbidden`), so every ending is reachable rather than fated:
\*
\*   banned = {}   -> the run permits everything, LiveFinish reaches "done",
\*                    and the replay of a completed run walks ReplayDone to
\*                    ReplayFinish.
\*   banned = {3}  -> the run stops at LiveDeny with the denial journaled, and
\*                    the replay stops in the same place through ReplayDenied.
\*
\* An unconditional Forbidden = {3} used to force EVERY live run into LiveDeny:
\* "done" was unreachable, and LiveFinish/ReplayFinish were dead transitions
\* that TLC never exercised. Two permitted effects still precede the possible
\* denial so replay walks ReplayDone more than once — a spec that never takes a
\* path is not checking it.

CONSTANTS
    EffectCount = 4
    Forbidden   = {3}

SPECIFICATION Spec

INVARIANT Safety

PROPERTIES
    JournalIsAppendOnly
    Settles
