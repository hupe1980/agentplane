\* Model for Authorization.
\*
\* Four effects, the third forbidden. Two permitted effects must precede the
\* denial so that replay actually walks the ReplayDone path more than once —
\* with the denial at position 1 or 2 the interesting transition is barely
\* exercised, and a spec that never takes a path is not checking it.

CONSTANTS
    EffectCount = 4
    Forbidden   = {3}

SPECIFICATION Spec

INVARIANT Safety
