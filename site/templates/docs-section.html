{% extends "base.html" %}
{% block content %}
<div class="docs-layout">
  <aside class="sidebar" aria-label="Documentation">
    <p class="side-title">Documentation</p>
    <nav><ol>
    {% for p in section.pages %}
      <li><a href="{{ p.permalink }}">{{ p.title }}</a></li>
    {% endfor %}
    </ol></nav>
  </aside>
  <article class="doc">
    <header>
      <h1>{{ section.title }}</h1>
      <p class="lede">{{ section.description }}</p>
    </header>
    <div class="cards">
    {% for p in section.pages %}
      <a class="card" href="{{ p.permalink }}">
        <h2>{{ p.title }}</h2>
        <p>{{ p.description }}</p>
      </a>
    {% endfor %}
    </div>
  </article>
</div>
{% endblock content %}
