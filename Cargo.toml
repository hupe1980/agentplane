[package]
name         = "agentplane"
version      = "0.13.0"
edition      = "2024"
rust-version = "1.94.1"
license      = "MIT OR Apache-2.0"
description  = "Durable, replayable agent runtime — the journal is the plan of record"
repository   = "https://github.com/hupe1980/agentplane"
readme       = "README.md"
keywords     = ["agent", "durable-execution", "replay", "runtime", "llm"]
categories   = ["asynchronous", "data-structures"]

# What ships, stated as an allowlist.
#
# A denylist has to predict every generated file; an allowlist cannot be
# surprised. That matters more here than for most crates, because a crates.io
# publish is immutable — a file that should not have shipped cannot be
# withdrawn, only yanked with the contents still served.
#
# Development infrastructure (`tests/`, `spec/`, `tools/`, `justfile`) is
# deliberately absent: a consumer building this crate has no use for the TLA+
# specs or the mutation table. The guides live at hupe1980.github.io/agentplane,
# so the README links out rather than freezing a copy in every release.
#
# Leading slashes anchor to the package root; without them these are
# gitignore-style globs matching any depth.
include = [
    "/src/**/*.rs",
    "/examples/*.rs",
    # An example `include_str!`s a manifest, so without these the packaged crate
    # does not compile — and `cargo package --list` alone would not say so.
    "/examples/*.yaml",
    "/examples/*.cedar",
    "/src/bin/*.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/clippy.toml",
]

# docs.rs builds with default features unless told otherwise, and this crate's
# story is almost entirely in the feature-gated seams — a reader landing on the
# published docs would find neither the HTTP surface, nor the drivers, nor the
# policy adapter.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["redb"]
# Embedded journal + case store, on redb: pure Rust, two crates deep, ACID
# transactions across tables, and a stable on-disk format. Single-node
# deployments; Postgres backs the active-active topology.
#
# Exactly-once is the table key rather than an index, so a duplicate effect
# start is inexpressible rather than rejected.
redb = ["dep:redb"]
# The agent declaration: tool grants, budgets, egress ceiling, injection
# pattern. Off by default because the runtime is perfectly usable wired by
# builder calls; the manifest is what makes those declarations reviewable.
manifest = ["dep:serde_yaml_ng", "dep:base64", "dep:jsonschema"]
# Everything the `agentplane` binary needs to run a declarative agent.
cli = ["manifest", "redb", "providers", "bedrock", "testkit", "dep:tracing-subscriber", "dep:clap"]
# Content-addressed blobs on any backend OpenDAL reaches. Bytes too big for the
# chain go here and the chain commits to their digest. Deliberately not the
# journal's own store: an object store has no ordered scan, no multi-key
# transaction and no unique constraint, which is all the journal needs.
opendal = ["dep:opendal"]
# Envelope encryption for payload bytes, and the erasure it makes provable.
# Destroying the wrapping key makes every copy unreadable at once — live store,
# replica, and every backup ever taken — which deleting a row cannot do.
keyring = ["dep:chacha20poly1305", "dep:base64"]
# A key ring that is somebody else: HashiCorp Vault's transit engine, over its
# documented HTTP API. The wrapping key is created inside Vault and never leaves
# it, so erasure is something this crate asks for and cannot undo.
keyring-vault = ["keyring", "dep:reqwest"]
# Fault injection and other harness pieces, for this crate's assurance layers
# and for embedders testing their own stores and skills. Never in a production
# build — nothing in `testkit` is reachable without it.
testkit = []
# Cedar as the authorization engine. Off by default: the crate defines the
# policy seam and ships no evaluator, for the same reason it ships no tracing
# exporter — picking one for the embedder is not its call.
cedar = ["dep:cedar-policy"]
# PostgreSQL-backed journal. The topology an embedded store cannot serve: several plane
# instances sharing one store, where fencing and exactly-once must be arbitrated
# by the database rather than by hoping the writers agree.
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres"]
# MCP transport. The tool *seam* and its safety model are always available; this
# is only the wire. Separate because the catalogue is what decides what a tool is
# allowed to do, and that decision must not depend on which transport is linked.
mcp = ["dep:rmcp"]

# Reach an MCP server by **running it** — the stdio child process most published
# servers are. Separate from `mcp` because the host surface is
# transport-agnostic on purpose (`McpClient::new` takes a connection somebody
# else made), and this costs 8 crates plus `tokio/process` that an embedder
# connecting over their own transport should not pay for. It is what lets
# `agentplane run`/`serve` execute a declarative `tool-calling` agent with no
# Rust.
mcp-stdio = ["mcp", "rmcp/transport-child-process"]
# HTTP surface for operators: the worklist, run status, event delivery. Off by
# default — a library embedded in someone else's process should not open a port
# unless asked.
# `tokio/net` and `rt-multi-thread` are what `agentplane serve` binds a socket
# with. The base tokio features are `sync`/`rt`/`macros`/`time` — enough for a
# library driving effects, and short of a server by exactly a listener.
http = ["dep:axum", "tokio/net", "tokio/rt-multi-thread"]
# Submitting checkpoints to a real witness — the half that makes the split-view
# guarantee have a counterparty.
witness-http = ["dep:reqwest"]
# A2A transport: the wire for peer calls. The peer *seam* — audience-bound
# credentials, attenuating delegation, the disposition vocabulary — is always
# available; this is only the JSON-RPC client that carries it. Separate for the
# same reason `mcp` is: what a peer is allowed to do must not depend on which
# transport happens to be linked.
a2a = ["dep:reqwest"]
# Serve this plane as an A2A agent: the public card plus the JSON-RPC methods.
# `push` is not optional here: A2A 1.0 defines push notification configs as part
# of the protocol, and this server implements them unconditionally.
a2a-server = ["http", "manifest", "push", "dep:async-stream"]
# Webhook delivery for A2A push notifications: a durable config store plus
# SSRF-guarded outbound POSTs.
push = ["dep:reqwest"]
# Ed25519 signing for journal records. The *seam* — `Signer`, `Verifier`, the
# attestation on every record, the verifying read path — is always available;
# this is one concrete implementation, for deployments that do not already have
# a workload-identity signer to plug in.
signing = ["dep:ed25519-dalek"]
# Model provider drivers over HTTP. The `ModelProvider` trait and the metering
# rules are always available; this is a concrete driver.
providers = ["dep:reqwest", "dep:jsonschema"]
# Amazon Bedrock's Converse API. Separate from `providers` because the AWS SDK
# dependency graph is substantial and neither OpenAI nor Anthropic users should
# pay for it. The provider-neutral model seam remains unconditional.
bedrock = ["dep:aws-config", "dep:aws-sdk-bedrockruntime", "dep:aws-smithy-types", "dep:base64", "dep:jsonschema"]
# Governed remote-media ingestion. Kept separate from model providers because
# dereferencing an untrusted URL is a security boundary of its own: every DNS
# answer and redirect is checked and pinned before bytes enter blob storage.
media = ["dep:base64", "dep:reqwest", "tokio/net"]

[dependencies]
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
serde       = { version = "1", features = ["derive"] }
# NOTE: this crate must not ask for `preserve_order`, but it can no longer
# assume nobody does — cargo unifies features across the graph and cedar-policy
# enables it. Canonical order is therefore produced by `core::canon` itself
# rather than inherited from serde_json::Map. See that module.
serde_json  = "1"
# Schema *from the type*, so a tool's arguments have one declaration rather
# than a hand-written copy in a manifest and a hand-indexed copy in the body.
schemars    = "1"
jsonschema  = { version = "0.49.5", default-features = false, optional = true }
futures-core = "0.3"
thiserror   = "2"
ulid        = { version = "1", features = ["serde"] }
sha2        = "0.10"
hex         = "0.4"
# Secrets are wiped when they drop. `String` alone leaves the bytes in freed
# heap — and reallocates copies of them on growth — which no amount of careful
# `Debug` impl fixes. Small, audited, and unconditional: an API key is not an
# optional-feature concern.
zeroize     = { version = "1", features = ["alloc", "derive"] }
time        = { version = "0.3", features = ["serde-well-known", "macros", "formatting", "parsing"] }
rand        = "0.9"
rand_chacha = "0.9"
tokio       = { version = "1", features = ["sync", "rt", "macros", "time"] }
# Only `join_all` is used, to dispatch a ready set concurrently. Deliberately
# not `futures` proper: the executor needs one combinator, not an ecosystem.
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
async-stream = { version = "0.3", optional = true }
tracing     = "0.1"
# Several controls here are quiet toward the caller and loud toward the
# operator: an A2A decline names the determining policy in a `tracing` event and
# tells the peer nothing, so a prober cannot map the authorization vocabulary.
# With no subscriber installed, that second half reaches nobody.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "env-filter"], optional = true }
# The binary's argument parser. A flag lives on its subcommand's struct, so
# passing a `serve` flag to `run` fails to parse rather than being silently
# accepted and ignored — which is what a hand-rolled table did, including for a
# security control. +9 crates on `cli`, +0 on the library; re-derive with
# `cargo tree --no-default-features --features cli -e normal --prefix none |
# sort -u | wc -l`.
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions", "env", "wrap_help"], optional = true }
redb        = { version = "3", optional = true }
# The maintained fork of serde_yaml, which is deprecated. Ten crates deep.
serde_yaml_ng = { version = "0.10", optional = true }
# `default-features = false`: the defaults pull in a long list of service
# backends. An embedder picks the one they use; `services-fs` is the only one
# that makes sense to assume.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"], optional = true }
opendal     = { version = "0.58", default-features = false, features = ["services-fs"], optional = true }
cedar-policy = { version = "4.12.0", default-features = false, optional = true }
tokio-postgres = { version = "0.7.18", optional = true, features = [
  # `jsonb` parameters for a co-located resource. Without it `SqlValue::Json`
  # would have to be bound as text, and a resource updating a jsonb column
  # would get a type error at runtime rather than a value.
  "with-serde_json-1",
] }
deadpool-postgres = { version = "0.14.1", optional = true }
rmcp = { version = "3.1", default-features = false, features = ["client", "transport-io"], optional = true }
# `query` for `?outcome=…` on the run list. Kept to the four features that
# are actually used: axum's default set pulls in a router's worth of
# extractors this surface never touches.
axum = { version = "0.8.9", default-features = false, features = ["json", "http1", "tokio", "query"], optional = true }
# `rustls` rather than the platform's TLS: one static binary is a design
# commitment (P11), and linking OpenSSL puts a system dependency back in.
# `rand_core` off: keys come from the deployment, and a signer that can mint its
# own identity is a signer whose signatures mean nothing.
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "zeroize", "signature"], optional = true }
# `rustls`, not `native-tls`: one TLS stack, in Rust, so a deployment's threat
# model need not include OpenSSL's. `stream` gates `Response::bytes_stream`,
# which is how a driver learns what a severed call burned — without it the only
# honest report is "cost unknown" and the runaway-provider ceiling reads zero.
#
# The **trust anchor is the operating system's store**, via
# `rustls-platform-verifier`. That is a decision, not a default: the operator
# already administers a CA policy, and a runtime that ignored it would break
# every corporate inspection proxy while claiming to be more secure. Do not add
# `webpki-roots` — reqwest declares it as an optional dependency and never
# writes `dep:webpki-roots`, so Cargo synthesises an implicit feature that links
# Mozilla's whole bundle while the verifier stays the platform one. A guard in
# `tests/guards/docs.rs` keeps it gone.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "charset", "stream"], optional = true }
# Defaults declined on both AWS crates for one reason: the SDK's `rustls` feature
# is `legacy-rustls-ring`, pinning `rustls` 0.21 and `rustls-webpki` 0.101 —
# three live RUSTSEC advisories against certificate validation.
# `default-https-client` selects the maintained `rustls-aws-lc` stack. A TLS
# client must not be whatever a transitive default picks; `just audit` keeps it
# honest.
aws-config = { version = "1.10.1", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso", "behavior-version-latest"], optional = true }
aws-sdk-bedrockruntime = { version = "1.139.0", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"], optional = true }
aws-smithy-types = { version = "1.6.1", optional = true }

[dev-dependencies]
# An **independent** A2A server, as a test double. The conformance kit validates
# servers, so this crate's *client* had no outside authority to talk to — the
# one interoperability gap the kit cannot close. Pre-1.0 churn is tolerable for a
# test double in a way it is not for a shipped boundary: nothing in `src/` links
# these, and `cargo package` does not carry dev-dependencies.
#
# `default-features = false`: the default pulls a TLS stack this needs for
# nothing — the double binds a loopback port over plain HTTP.
a2a-lf = { version = "0.3.0", default-features = false }
a2a-server-lf = { version = "0.4.1", default-features = false }
# For the Bedrock unit tests: a stub HTTP client, so building an SDK `Config`
# never constructs the default TLS provider. That provider reads the OS trust
# store eagerly, and under a fully parallel test run the macOS keychain read
# can transiently yield zero roots — which aws-smithy answers with a panic, in
# a test that never needed a connection at all. Already in the tree
# transitively; this only turns its test feature on for tests.
aws-smithy-http-client = { version = "1", features = ["test-util"] }
# For the streaming driver tests: the stub server hands axum a body stream of
# `Bytes`, including one that errors partway so a severed response can be tested
# without a real network.
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
http = "1"
rmcp = { version = "3.1", default-features = false, features = ["server", "transport-io", "macros"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
# So the telemetry tests can assert what was *emitted*, not merely what the
# source contains. An instrumentation test that greps is checking the author's
# intent; this checks the runtime's behaviour.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }

# Examples drive the runtime end to end and therefore need a store. Declaring
# the requirement keeps `--no-default-features` building: an embedder bringing
# their own backend must not be forced to compile SQLite.
# The CLI that makes the declarative tier need no Rust at all.
#
# Feature-gated and not built by default, because the library is the product and
# a binary that pulls in HTTP drivers is not something every dependant wants
# compiled. `cargo install agentplane --features cli` opts in.
[[bin]]
name              = "agentplane"
path              = "src/bin/agentplane.rs"
required-features = ["cli"]

[[example]]
name              = "openai_live"
required-features = ["redb", "providers"]

[[example]]
name              = "bedrock_live"
required-features = ["bedrock"]

[[example]]
name              = "journal_bench"
required-features = ["redb"]

[[example]]
name              = "hello_skill"
required-features = ["redb"]

[[example]]
name              = "durable_pipeline"
required-features = ["redb"]

[[example]]
name              = "effect_group"
required-features = ["redb"]

[[example]]
name              = "tool_loop"
required-features = ["redb", "testkit", "manifest"]

[[example]]
name              = "planned_run"
required-features = ["redb", "testkit", "manifest"]

[[example]]
name              = "sealed_run"
required-features = ["redb", "testkit", "keyring"]

[[example]]
name              = "clearing_case"
required-features = ["redb"]

[[example]]
name              = "plan_graph"
required-features = ["redb"]

[[example]]
name              = "governed_transfer"
required-features = ["redb"]

[[example]]
name              = "saga_checkout"
required-features = ["redb"]

[[example]]
name              = "memory_run"
required-features = ["redb"]

# Needs `testkit` for the fake provider. Deliberately: an example that called a
# real model would need an API key to run, and the claim it demonstrates — that
# a completion replays from the journal rather than being asked again — would
# stay a sentence in the README instead of something anyone can execute.
[[example]]
name              = "model_run"
required-features = ["redb", "testkit"]

# Digest-only multimodal dispatch and strict zero-I/O replay, with a fake model
# and an in-memory blob store so the security contract is runnable offline.
[[example]]
name              = "media_run"
required-features = ["redb", "testkit", "media"]

# The manifest example reads `examples/triage.yaml` and runs the agent it
# declares, so it needs the parser as well as the fake provider.
[[example]]
name              = "manifest_run"
required-features = ["redb", "testkit", "manifest"]

# A real MCP server in-process beside a typed tool, so the two-transport shape
# is runnable rather than only described. `rmcp`'s server half is a
# dev-dependency, which examples may use.
[[example]]
name              = "mcp_tools"
required-features = ["redb", "testkit", "manifest", "mcp"]

# Three agents, three manifests, three runtimes.
[[example]]
name              = "blog_room"
required-features = ["redb", "testkit", "manifest"]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all       = { level = "warn", priority = -1 }
pedantic  = { level = "warn", priority = -1 }
# Ambient non-determinism is denied crate-wide via clippy.toml: every
# clock/RNG/ID read must go through StepCtx, which journals it.
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
# `duration_suboptimal_units` asks for `Duration::from_hours` / `from_days`,
# which are **unstable** — `duration_constructors`, still not stabilised on the
# declared MSRV, while `from_secs` and `from_mins` are. So the lint's advice is
# uncompilable here rather than merely unwanted, and following it would trade a
# readability nit for a nightly dependency.
#
# The premise is checkable, which is what keeps this from becoming a decision
# whose reason expired: `rustc +1.94.1 -e 'fn main(){std::time::Duration::from_hours(1);}'`
# fails today and will stop failing when the feature lands. Remove this line
# then; the lint is right about the readability.
duration_suboptimal_units = "allow"
must_use_candidate      = "allow"


# The A2A server has a full test suite and, until now, nothing a reader could
# run. `tower::oneshot` drives the router in-process, so the round trip is real
# without a port, a key, or a second process.
[[example]]
name              = "a2a_peer"
required-features = ["redb", "a2a-server", "manifest"]

# Serves the A2A surface for the official conformance kit — `just test-a2a-tck`
# boots it and runs the kit's MUST battery against the live socket.
[[example]]
name              = "a2a_tck_live"
# `testkit` too, for the loopback push exception: the kit's webhook receiver is
# an `http://localhost:PORT` server, so without it the ten push MUSTs cannot run
# at all. The exception exists only under `testkit`, which never ships.
required-features = ["redb", "a2a-server", "manifest", "testkit"]

# The ceiling that outlives a run, end to end: cumulative across runs,
# exhausted, then revoked — with the terms still readable afterwards.
[[example]]
name              = "standing_authority"
required-features = ["redb", "testkit"]

# Live deltas beside a single journaled completion — the one part of the model
# seam a fake could not reach until `FakeProvider::streaming`.
[[example]]
name              = "streaming_run"
required-features = ["redb", "testkit"]
